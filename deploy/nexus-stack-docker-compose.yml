version: '3.8'
services:
  nexus-gateway:
    image: 'ghcr.io/ramsesdb/nexus-ai-gateway:latest'
    container_name: nexus-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    healthcheck:
      disable: true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.nexus-gateway.rule=Host(`api.ramsesdb.tech`)"
      - "traefik.http.routers.nexus-gateway.entrypoints=https"
      - "traefik.http.routers.nexus-gateway.tls=true"
      - "traefik.http.routers.nexus-gateway.service=nexus-gateway"
      - "traefik.http.services.nexus-gateway.loadbalancer.server.port=3000"
    environment:
      - PORT=3000
      - 'CORS_ORIGIN=https://brain.ramsesdb.tech,https://ramsesdb.tech,https://api.ramsesdb.tech'
      - 'GROQ_KEY_1=${GROQ_KEY_1}'
      - 'GEMINI_KEY_1=${GEMINI_KEY_1}'
      - 'OPENROUTER_KEY_1=${OPENROUTER_KEY_1}'
      - 'CEREBRAS_KEY_1=${CEREBRAS_KEY_1}'
    networks:
      - coolify

  open-webui:
    image: 'ghcr.io/open-webui/open-webui:main'
    container_name: open-webui
    restart: unless-stopped
    ports:
      - '8081:8080'
    healthcheck:
      disable: true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.open-webui.rule=Host(`brain.ramsesdb.tech`)"
      - "traefik.http.routers.open-webui.entrypoints=https"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.routers.open-webui.service=open-webui"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    volumes:
      - 'open-webui-data:/app/backend/data'
    environment:
      - 'OPENAI_API_BASE_URL=http://nexus-gateway:3000/v1'
      - 'OPENAI_API_KEY=${NEXUS_API_KEY}'
      - WEBUI_AUTH=true
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}'
      - ENABLE_CODE_EXECUTION=false
      - ENABLE_DIRECT_CONNECTIONS=false
    depends_on:
      - nexus-gateway
    networks:
      - coolify

  n8n:
    image: 'n8nio/n8n:latest'
    container_name: n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    healthcheck:
      disable: true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.n8n.rule=Host(`flows.ramsesdb.tech`)"
      - "traefik.http.routers.n8n.entrypoints=https"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.service=n8n"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    volumes:
      - 'n8n-data:/home/node/.n8n'
    environment:
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Santo_Domingo
      - N8N_HOST=flows.ramsesdb.tech
      - N8N_PROTOCOL=https
      - 'WEBHOOK_URL=https://flows.ramsesdb.tech'
      - 'N8N_EDITOR_BASE_URL=https://flows.ramsesdb.tech'
      - N8N_SECURE_COOKIE=true
      - 'N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}'
    networks:
      - coolify

volumes:
  open-webui-data:
  n8n-data:

networks:
  coolify:
    external: true
